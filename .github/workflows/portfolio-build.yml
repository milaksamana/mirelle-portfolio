name: Portfolio build check

on:
  push:
    branches:
      - coach/yellow-va-portfolio
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Type-check and build
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build portfolio
        run: npm run build
